  label: PhD Student, Cognitive Psychology · NSF GRFP Fellow
  email: clara.haeffner@yale.edu
  location: New Haven, CT
  image: ""
  summary: >
    PhD student in Cognitive Psychology at Yale University studying how affect shapes the ways we perceive and
    respond to uncertainty, with a focus on mental health and stress. I use computational modeling of
    decision-making, reinforcement learning, smartphone/EMA data, and longitudinal approaches.

